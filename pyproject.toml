[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-application-assistant"
version = "0.1.0"
description = "A privacy-first Windows desktop job-search and application assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "platformdirs>=4.0,<5",
    "pypdf>=4.0,<6",
    "python-docx>=1.1,<2",
    "reportlab>=4.0,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
build = ["PyInstaller>=6,<7"]

[project.scripts]
job-assistant = "job_assistant.app:main"

[tool.setuptools.packages.find]
include = ["job_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
