# Lint configuration.
#
# The rule set below is deliberately narrow: it is the set the whole existing
# code base passes today, so CI can treat any new finding as a regression.
# Widening it (datetime-naive checks, import sorting, annotations, ...) is a
# separate cleanup pass over ~9.5k lines - tracked, not bundled with packaging.
line-length = 100
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]
