# Publish a GitHub Release from an already-verified Windows MSI.
#
# Two triggers:
#   * workflow_dispatch — attach a specific windows-installer run
#   * workflow_run     — after a green windows-installer run on main, publish
#                         v{jautomatic.__version__} unless that tag already exists
#
# The sandbox that authors this repo cannot download Actions artefacts (Azure
# blob TLS is blocked), so the MSI is attached here, on a GitHub runner.
name: publish-release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "windows-installer run that produced the MSI (empty = latest successful on main)"
        required: false
        type: string
        default: ""
      tag:
        description: "Release tag (empty = v{version from the repo})"
        required: false
        type: string
        default: ""
  workflow_run:
    workflows: ["windows-installer"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve installer run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="${{ inputs.run_id }}"
            if [ -z "$RUN_ID" ]; then
              RUN_ID=$(gh run list --repo "${{ github.repository }}" \
                --workflow windows-installer.yml --branch main --status success \
                --limit 1 --json databaseId --jq '.[0].databaseId')
            fi
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful windows-installer run found." >&2
            exit 1
          fi
          META=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" \
            --json conclusion,headSha,url,headBranch,displayTitle)
          echo "$META"
          CONCLUSION=$(echo "$META" | python3 -c "import json,sys; print(json.load(sys.stdin)['conclusion'])")
          if [ "$CONCLUSION" != "success" ]; then
            echo "Installer run $RUN_ID did not succeed ($CONCLUSION)." >&2
            exit 1
          fi
          SHA=$(echo "$META" | python3 -c "import json,sys; print(json.load(sys.stdin)['headSha'])")
          URL=$(echo "$META" | python3 -c "import json,sys; print(json.load(sys.stdin)['url'])")
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download MSI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${{ steps.run.outputs.id }}" --repo "${{ github.repository }}" \
            -n JAUTOMATIC-Setup-x64 -D dist
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "from jautomatic import __version__; print(__version__)")
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}"
          if [ -z "$TAG" ]; then TAG="v$VERSION"; fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          MSI=$(python3 packaging/build_info.py MSI_FILENAME)
          if [ ! -f "dist/$MSI" ]; then
            echo "Expected dist/$MSI from the installer run; found:" >&2
            ls -la dist >&2
            exit 1
          fi
          python3 tools/release_notes.py --version "$VERSION" --msi "dist/$MSI" \
            --run-url "${{ steps.run.outputs.url }}" --out release-notes.md
          gh release create "$TAG" "dist/$MSI" \
            --repo "${{ github.repository }}" \
            --title "JAUTOMATIC JOB SEARCH $VERSION" \
            --notes-file release-notes.md \
            --target "${{ steps.run.outputs.sha }}" \
            --latest
