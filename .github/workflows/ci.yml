name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: Lint
        run: python -m ruff check jautomatic main.py tools tests packaging

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Headless smoke test
        run: python main.py --selftest

  packaging:
    name: Packaging guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generated artwork is committed and current
        run: python tools/make_assets.py --check

      - name: Installer EULA is derived from LICENSE
        run: python packaging/make_eula.py --check

      - name: Third-party notices cover the shipped closure
        run: python packaging/check_notices.py --list

      - name: Packaging unit tests (spec, WiX source, identities)
        run: python -m unittest tests.test_packaging -v
